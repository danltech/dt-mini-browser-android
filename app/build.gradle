plugins {
    id 'com.android.application'
}

android {
    namespace 'dt.minibrowser'
    compileSdk 36

    defaultConfig {
        applicationId 'dt.minibrowser'
        minSdk 16
        targetSdk 36
        versionCode 11
        versionName '1.0.1-beta'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        error 'NewApi'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
